schema_version: 1
id: ar-hexiao-daily-lab
name: 应收核销日清极速版
version: 1.6.24-lab.6.local.1
status: published
category: 应收管理
description: 应收核销多阶段流程，自动登录智云取数，按核销记录身份审计并纠正可解释的系统重复核销；日清与写前校验通过后直接安全写入副本，并按真实单元格坐标归一化公式差异。
ui:
  employee_name: 应收核销日清极速版
  short_description: 应收核销多阶段流程，自动登录智云取数，按核销记录身份审计并纠正可解释的系统重复核销；日清与写前校验通过后直接安全写入副本，并按真实单元格坐标归一化公式差异。
  categories:
  - 应收管理
  estimated_minutes: 10
  output_summary: 写入后的到账流转表、年度盈亏核算表和核销日清
  action_label: 开始核销
  popular: false
tags:
- 应收核销
- 自动写入
- 多阶段
operational_profile:
  execution_kind: guided_workflow
  external_sources:
  - system: 智云
    access: direct_read
    required: true
  employee_labels:
  - 智云取数
  - 复用业务材料
  - 写入工作副本
file_inputs:
- role: profit_loss_ledgers
  name: 年度盈亏核算表
  description: 可上传多个年度的盈亏核算表，每个年度保留一份；首次上传后后续任务会自动复用，也可以按需增加或替换。
  required: true
  multiple: true
  min_files: 1
  extensions:
  - xlsx
  - xlsm
  - xls
  max_size_mb: 100
- role: receipt_flow_table
  name: 到账流转表
  description: 只保留一份到账流转表；首次上传后后续任务会自动复用，需要更换时再上传新表。
  required: true
  multiple: false
  min_files: 1
  extensions:
  - xlsx
  - xlsm
  - xls
  max_size_mb: 100
input_schema:
  type: object
  additionalProperties: false
  properties: {}
output_schema:
  type: object
  required:
  - status
  - summary
  - output_files
  - warnings
  properties:
    status:
      const: success
    summary:
      type: object
    output_files:
      type: array
    warnings:
      type: array
handler:
  adapter: workflow
  worker_pool: workflow
execution:
  default_mode: workflow
  modes:
    workflow:
      adapter: workflow
      worker_pool: workflow
    pi_harness:
      adapter: pi_harness
      worker_pool: agent
      instructions: SKILL.md
      tools: config/agent-tools.yaml
runtime:
  timeout_seconds: 1800
  memory_mb: 2048
  concurrency_limit: 1
  network_access: true
  network_targets:
  - http://192.168.10.167:18880
risk:
  level: write
  requires_confirmation: true
  requires_change_review: true
  requires_approval: true
  modifies_uploaded_files: false
permissions:
  run: finance_user
  manage: skill_admin
safety_constraints: {}
progress_stages:
- key: reading_files
  label: 正在读取文件
- key: validating_fields
  label: 正在检查字段
- key: processing
  label: 正在处理数据
- key: generating_output
  label: 正在生成结果文件
result_presentation:
  metrics: []
