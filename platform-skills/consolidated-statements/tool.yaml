schema_version: 1
id: consolidated-statements
name: 合并报表
version: 1.0.11
status: published
category: 财务报表
description: 按本部字段标准汇总八主体的资产负债表、利润表和现金流量表，生成合并及母公司六张主表。
ui:
  employee_name: 合并报表
  short_description: 选择会计月份，汇总金蝶及外部公司报表，明细为数值、合计汇总为公式，生成完整底稿及合并、母公司分册。
  categories:
  - 财务报表
  estimated_minutes: 10
  output_summary: 六表完整底稿、三张合并表分册、三张母公司表分册及核验记录
  action_label: 运行报表任务
  popular: false
tags:
- Excel
- 月报
operational_profile:
  execution_kind: browser_rpa
  external_sources:
  - system: 金蝶
    access: browser_rpa
    required: false
  employee_labels:
  - 按月汇总
  - 保留来源
  - 山东费用计入成本
file_inputs:
- role: reports
  name: 公司原始报表
  required: false
  multiple: true
  min_files: 0
  extensions:
  - xlsx
  - xls
  max_size_mb: 30
input_schema:
  type: object
  additionalProperties: false
  required:
  - period
  properties:
    period:
      type: string
      title: 会计月份
      pattern: ^20\d{2}(0[1-9]|1[0-2])$
    fetch_kingdee:
      type: boolean
      title: 获取金蝶报表
      default: false
    parent_run_id:
      type: string
      pattern: ^[a-f0-9-]{36}$
output_schema:
  type: object
  required:
  - status
  - summary
  - output_files
  - warnings
  properties:
    status:
      const: success
    summary:
      type: object
    output_files:
      type: array
    warnings:
      type: array
handler:
  adapter: rpa
  entrypoint: scripts/entry.py
  worker_pool: python
runtime:
  timeout_seconds: 1800
  memory_mb: 2048
  concurrency_limit: 1
  network_access: true
  network_targets:
  - https://www.jdy.com:443
  - https://service.jdy.com:443
  - https://sso.jdy.com:443
  - https://tf.jdy.com:443
  - https://cdn.jdy.com:443
  - https://static.jdy.com:443
  - https://localsrv.jdy.com:443
  - https://app.kdcloud.com:443
  - https://static.yunzhijia.com:443
  - https://www.yunzhijia.com:443
  - https://api.geetest.com:443
  - https://static.geetest.com:443
  - https://g.alicdn.com:443
risk:
  level: read_only
  requires_confirmation: false
  requires_change_review: false
  requires_approval: false
  modifies_uploaded_files: false
progress_stages:
- key: reading_files
  label: 核对来源
- key: mapping
  label: 映射及分类
- key: generating_output
  label: 生成报表
result_presentation:
  metrics:
  - key: report_count
    label: 已纳入报表数
  - key: formula_count
    label: 合计及汇总公式数
permissions:
  run: finance_user
  manage: skill_admin
