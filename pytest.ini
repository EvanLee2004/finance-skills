# pytest 配置（finance-skills monorepo）
#
# 同名 test_robustness.py 冲突：pytest 官方提示用唯一 basename
# 出处：https://docs.pytest.org/en/stable/explanation/pythonpath.html
#   「HINT: … use a unique basename for your test file modules」
# 各 skill 已改为 test_<skill>_robustness.py；默认 prepend 导入即可，
# 且 ar-hexiao-daily 的 `from conftest import …` 继续可用
# （importmode=importlib 会让 conftest 无法作普通模块 import）。
[pytest]
testpaths = skills
python_files = test_*.py
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
